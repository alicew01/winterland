<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WINTERLAND · 雪国俱乐部</title>
<style>
:root{--blue:#426782;--pale:#e7eff3;--paper:#fffaf0;--line:#a4b9c5}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;background:radial-gradient(ellipse at 50% 15%,#f6f9f8 0%,#e5eef2 58%,#d7e5ec 100%);font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;color:var(--blue)}
.back{align-self:flex-start;max-width:470px;width:100%;margin:0 auto 22px;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#52768e;text-decoration:none}
.paper{position:relative;width:min(100%,470px);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:55px 28px 60px;text-align:center;box-shadow:5px 7px 0 #cbdbe4,0 16px 35px #65849a18}
.paper:before{content:"";position:absolute;inset:9px;border:1px dashed #c6d1d5;pointer-events:none;border-radius:3px}
.eyebrow{font:10px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:4px;color:#8ba2ae}
.stamp{width:88px;height:88px;margin:30px auto 25px;border:2px solid #91a9b7;border-radius:50%;display:grid;place-items:center;transform:rotate(-12deg);color:#6c90a4;font-size:38px;box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 6px #b7c8d0}
h1{font-size:27px;letter-spacing:3px;font-weight:500;margin:0 0 17px}
.rule{height:1px;background:linear-gradient(90deg,transparent,#bdcdd4,transparent);margin:24px auto;width:80%}
.desc{font-size:14px;line-height:2.2;color:#66859a;margin:0}
.small{margin-top:34px;font-size:11px;letter-spacing:2px;color:#96a9b3}
.footer{font-size:10px;letter-spacing:3px;color:#8fa5b2;margin-top:30px}
@media(max-width:400px){.paper{padding:45px 20px 48px}h1{font-size:24px}}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回冬日小镇</a>
<main class="paper">
<div class="eyebrow">WINTERLAND · WINTER CLUB</div>
<div class="stamp" aria-hidden="true">❄</div>
<h1>雪国俱乐部</h1>
<div class="rule"></div>
<p class="desc">小镇的惊喜正在悄悄准备中。<br>请收好这份期待，<br>我们会在合适的时候揭晓。</p>
<div class="small">✧ 敬请期待 ✧</div>
</main>
<div class="footer">WINTERLAND · 只在冬天开放的小镇</div>
</body>
</html>
